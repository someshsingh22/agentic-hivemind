out: runs/calibration_v5
seed: 0
n_hypotheses: null          # null = all; else a seeded sample of n

agent:                      # pi coding agent (@earendil-works/pi-coding-agent); it can read the dataset itself
  provider: azure-anthropic
  api: anthropic-messages
  base_url: https://${ANTHROPIC_FOUNDRY_RESOURCE}.services.ai.azure.com/anthropic
  api_key_env: ANTHROPIC_FOUNDRY_API_KEY
  model: claude-sonnet-5-5
  thinking: medium          # off | minimal | low | medium | high | xhigh
  tools: read,bash,submit     # submit = schema-validated final answer (ssh/submit.ts)
  max_tokens: 32000
  compat: {forceAdaptiveThinking: true, supportsStrictTools: true}   # adaptive thinking (Sonnet 5.5); strict = constrained tool decoding
  workers: 1                # shared Sonnet quota: avoid eight simultaneous agent sessions

embedding:
  base_url: https://${ANTHROPIC_FOUNDRY_RESOURCE}.services.ai.azure.com/openai/v1
  api_key_env: ANTHROPIC_FOUNDRY_API_KEY
  model: text-embedding-3-large

dedup:
  threshold: 0.25           # candidate cosine distance; Sonnet must also approve full-rubric equivalence

test:
  alpha: 0.05
